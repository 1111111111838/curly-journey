name: Download APK via Cloudscraper

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'הכנס את הקישור או את ה-Package Name'
        required: true
        default: 'com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # התקנת הספרייה שנועדה לעקוף את חסימות Cloudflare ו-403
    - name: Install Cloudscraper
      run: |
        pip install cloudscraper requests

    # יצירת סקריפט שמדמה דפדפן אמיתי ועוקף את חסימת ה-IP
    - name: Bypass Cloudflare and Download APK
      run: |
        cat << 'EOF' > download_apk.py
        import cloudscraper
        import sys
        import os

        package_name = sys.argv[1]
        if "id=" in package_name:
            package_name = package_name.split("id=")[1].split("&")[0]

        print(f"Bypassing Cloudflare protection for: {package_name}")
        
        # הגדרת הסקרייפר להתחזות לדפדפן כרום אמיתי על ווינדוס
        scraper = cloudscraper.create_scraper(
            browser={
                'browser': 'chrome',
                'platform': 'windows',
                'desktop': True
            }
        )
        
        url = f"https://d.apkpure.com/b/APK/{package_name}?version=latest"
        
        # ביצוע ההורדה בפועל
        response = scraper.get(url, stream=True, headers={'Referer': 'https://apkpure.com/'})
        
        if response.status_code == 200:
            with open(f"{package_name}.apk", 'wb') as f:
                for chunk in response.iter_content(chunk_size=8192):
                    if chunk:
                        f.write(chunk)
            print("Download completed successfully!")
        else:
            print(f"Error: Server returned status {response.status_code}")
            sys.exit(1)
        EOF
        
        python download_apk.py "${{ github.event.inputs.package_name }}"

    # שמירת הקובץ המוכן בטאב ה-Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-tadiran-apk
        path: '*.apk'
