name: Download Official APK from Play Store

on:
  workflow_dispatch:
    inputs:
      play_store_url:
        description: 'הכנס את הקישור המלא לאפליקציה בגוגל פליי'
        required: true
        default: 'https://play.google.com/store/apps/details?id=com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. הגדרת סביבת פייתון
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 2. התקנת ספריות נדרשות
    - name: Install Dependencies
      run: |
        pip install requests google-play-scraper

    # 3. יצירת סקריפט ישיר וממוקד ל-APKPure עם מעקף חסימה
    - name: Create Downloader Script
      run: |
        cat << 'EOF' > download_apk.py
        import sys
        import requests
        from google_play_scraper import app as play_app

        def get_official_apk(package_id):
            print(f"Analyzing Google Play metadata for: {package_id}")
            try:
                app_info = play_app(package_id, lang='en', country='us')
                print(f"App Found: {app_info['title']} (Version: {app_info.get('version', 'Latest')})")
            except Exception as e:
                print(f"Error finding app on Google Play: {e}")
                sys.exit(1)

            # פנייה ישירה לשרת ההורדות
            final_url = f"https://d.apkpure.com/b/APK/{package_id}?version=latest"
            
            # כותרות חובה כדי שהשרת יחשוב שאנחנו משתמש אמיתי שמוריד מהאתר שלהם
            headers = {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Referer': 'https://apkpure.com/'
            }

            print("Downloading APK via high-compatibility direct mirror...")
            apk_response = requests.get(final_url, headers=headers, stream=True)

            filename = f"{package_id}.apk"
            if apk_response.status_code == 200:
                with open(filename, 'wb') as f:
                    for chunk in apk_response.iter_content(chunk_size=8192):
                        if chunk:
                            f.write(chunk)
                print(f"Successfully downloaded and saved: {filename}")
            else:
                print(f"Failed to download APK. Status code: {apk_response.status_code}")
                sys.exit(1)

        if __name__ == "__main__":
            input_url = sys.argv[1]
            if "id=" in input_url:
                package_id = input_url.split("id=")[1].split("&")[0]
            else:
                package_id = input_url
            get_official_apk(package_id)
        EOF

    # 4. הרצת הסקריפט
    - name: Execute Download Script
      run: |
        python download_apk.py "${{ github.event.inputs.play_store_url }}"

    # 5. שמירת קובץ ה-APK שהורד בהצלחה
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: official-googleplay-apk
        path: '*.apk'
