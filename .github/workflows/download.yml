name: Download Official APK from Play Store

on:
  workflow_dispatch:
    inputs:
      play_store_url:
        description: 'הכנס את הקישור המלא לאפליקציה בגוגל פליי'
        required: true
        default: 'https://play.google.com/store/apps/details?id=com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. התקנת סביבת Node.js (בשביל כלי ההורדה החדיש)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 2. חילוץ ה-Package Name מתוך הקישור שהזנת
    - name: Extract Package Name
      id: extract_pkg
      run: |
        INPUT_VAL="${{ github.event.inputs.play_store_url }}"
        if [[ "$INPUT_VAL" == *"id="* ]]; then
          PACKAGE_ID=$(echo "$INPUT_VAL" | grep -oP 'id=\K[^&]+')
        else
          PACKAGE_ID="$INPUT_VAL"
        fi
        echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT

    # 3. הורדת ה-APK באמצעות כלי שעוקף את חסימות ה-IP של GitHub
    - name: Download APK via Mirror CLI
      run: |
        PKG_ID="${{ steps.extract_pkg.outputs.package_id }}"
        echo "Downloading APK for: $PKG_ID"
        
        # הרצת כלי הורדה ישיר דרך npx (מוריד ומריץ ללא התקנה קבועה)
        # הכלי פונה לשרת חלופי שאינו חוסם את שרתי GitHub
        npx apk-dl "$PKG_ID"
        
        # שינוי שם הקובץ שירד כדי שיהיה קל לזהות אותו
        # הכלי לרוב שומר את זה בתור [package_id].apk
        if [ -f "$PKG_ID.apk" ]; then
          echo "Download successful!"
        else
          # גיבוי קטן למקרה שהשם שונה
          mv *.apk "${PKG_ID}.apk" 2>/dev/null || echo "File renamed or checked"
        fi

    # 4. שמירת קובץ ה-APK שהורד בהצלחה בתוך ה-Artifacts של GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: official-googleplay-apk
        path: '*.apk'
