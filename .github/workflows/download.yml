name: Download Official APK from Google Play

on:
  workflow_dispatch:
    inputs:
      play_store_url:
        description: 'הכנס את הקישור המלא לאפליקציה בגוגל פליי'
        required: true
        default: 'https://play.google.com/store/apps/details?id=com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. חילוץ ה-Package Name מתוך הקישור שהזנת
    - name: Extract Package Name
      id: extract_pkg
      run: |
        INPUT_VAL="${{ github.event.inputs.play_store_url }}"
        if [[ "$INPUT_VAL" == *"id="* ]]; then
          PACKAGE_ID=$(echo "$INPUT_VAL" | grep -oP 'id=\K[^&]+')
        else
          PACKAGE_ID="$INPUT_VAL"
        fi
        echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT

    # 2. הורדה ישירה של ה-APK המקורי מחנות גוגל פליי דרך שרת ה-API של Evozi
    - name: Fetch APK via Google Play Mirror API
      run: |
        PKG_ID="${{ steps.extract_pkg.outputs.package_id }}"
        echo "Fetching official download link for: $PKG_ID"
        
        # פנייה לשרת שמחלץ את ה-APK הרשמי ישירות מגוגל
        RESPONSE=$(curl -s -X POST "https://apps.evozi.com/apk-downloader/api/" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "packagename=${PKG_ID}")
          
        # חילוץ קישור ההורדה מתוך התשובה
        DOWNLOAD_URL=$(echo $RESPONSE | grep -oP '"url":"\K[^"]+')
        
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "Error: Could not fetch official APK. Trying secondary direct method..."
          DOWNLOAD_URL="https://d.apkpure.com/b/APK/${PKG_ID}?version=latest"
        fi
        
        # תיקון תווים מיוחדים בקישור במידה ויש
        DOWNLOAD_URL=$(echo "$DOWNLOAD_URL" | sed 's/\\//g')
        echo "Downloading from: $DOWNLOAD_URL"
        
        # הורדת הקובץ בפועל אל השרת
        curl -L -o "${PKG_ID}.apk" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$DOWNLOAD_URL"
        
        # בדיקה שהקובץ אכן ירד וקיים
        if [ -f "${PKG_ID}.apk" ] && [ -s "${PKG_ID}.apk" ]; then
          echo "Successfully downloaded official APK!"
        else
          echo "Download failed."
          exit 1
        fi

    # 3. שמירת קובץ ה-APK שהורד בהצלחה בתוך ה-Artifacts של GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: official-playstore-apk
        path: '*.apk'
