name: Download APK from Google Play

on:
  workflow_dispatch:
    inputs:
      play_store_url:
        description: 'הכנס את הקישור המלא לאפליקציה בגוגל פליי'
        required: true
        default: 'https://play.google.com/store/apps/details?id=com.example.app'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install gpapi

    - name: Create Python Script
      run: |
        cat << 'EOF' > download_app.py
        import sys
        import os
        from gpapi.googleplay import GooglePlayAPI

        def download_apk(package_name):
            server = GooglePlayAPI(locale="en_US", timezone="UTC")
            server.login(os.environ['GOOGLE_EMAIL'], os.environ['GOOGLE_PASSWORD'], os.environ['DEVICE_ID'])
            
            print(f"Starting download for: {package_name}")
            doc = server.details(package_name)
            data = server.download(package_name, doc.versionCode)
            
            filename = f"{package_name}.apk"
            with open(filename, 'wb') as f:
                for chunk in data:
                    f.write(chunk)
            print(f"Saved: {filename}")

        if __name__ == "__main__":
            url = sys.argv[1]
            package_name = url.split("id=")[1].split("&")[0]
            download_apk(package_name)
        EOF

    - name: Download APK Execution
      env:
        GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
        GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
        DEVICE_ID: ${{ secrets.DEVICE_ID }}
        PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: 'python'
      run: |
        python download_app.py "${{ github.event.inputs.play_store_url }}"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-apk
        path: '*.apk'
