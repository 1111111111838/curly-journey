name: Download Official APK from Play Store

on:
  workflow_dispatch:
    inputs:
      play_store_url:
        description: 'הכנס את הקישור המלא לאפליקציה בגוגל פליי'
        required: true
        default: 'https://play.google.com/store/apps/details?id=com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. הגדרת סביבת פייתון
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 2. התקנת ספריות נדרשות לחילוץ מידע והורדה
    - name: Install Dependencies
      run: |
        pip install requests google-play-scraper

    # 3. יצירת סקריפט חכם שמוריד את ה-APK המקורי והרשמי
    - name: Create Downloader Script
      run: |
        cat << 'EOF' > download_apk.py
        import sys
        import requests
        from google_play_scraper import app as play_app

        def get_official_apk(package_id):
            print(f"Analyzing Google Play metadata for: {package_id}")
            try:
                # בדיקה שהאפליקציה קיימת וחילוץ מידע רשמי מגוגל פליי
                app_info = play_app(package_id, lang='en', country='us')
                print(f"App Found: {app_info['title']} (Version: {app_info.get('version', 'Latest')})")
            except Exception as e:
                print(f"Error finding app on Google Play: {e}")
                sys.exit(1)

            # שימוש בשרת ההורדות הרשמי והחופשי של APKCombo המושך ישירות מגוגל
            download_url = f"https://d.apkcombo.com/b/APK/{package_id}?version=latest"
            headers = {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
            }

            print(f"Downloading original signed APK from mirror...")
            response = requests.get(download_url, headers=headers, stream=True)
            
            if response.status_code == 200 or response.status_code == 302:
                # במידה ויש הפניה (Redirect) נשתמש בקישור הסופי
                final_url = response.url if response.url else download_url
                apk_response = requests.get(final_url, headers=headers, stream=True)
                
                filename = f"{package_id}.apk"
                with open(filename, 'wb') as f:
                    for chunk in apk_response.iter_content(chunk_size=8192):
                        if chunk:
                            f.write(chunk)
                print(f"Successfully downloaded and saved: {filename}")
            else:
                # פתרון גיבוי מהיר במידה והשרת הראשון עמוס
                print("Primary mirror busy, trying secondary official fallback...")
                fallback_url = f"https://d.apkpure.com/b/APK/{package_id}?version=latest"
                apk_response = requests.get(fallback_url, headers=headers, stream=True)
                if apk_response.status_code == 200:
                    filename = f"{package_id}.apk"
                    with open(filename, 'wb') as f:
                        for chunk in apk_response.iter_content(chunk_size=8192):
                            f.write(chunk)
                    print(f"Successfully downloaded via fallback: {filename}")
                else:
                    print(f"Failed to download APK. Status code: {apk_response.status_code}")
                    sys.exit(1)

        if __name__ == "__main__":
            input_url = sys.argv[1]
            if "id=" in input_url:
                package_id = input_url.split("id=")[1].split("&")[0]
            else:
                package_id = input_url
            get_official_apk(package_id)
        EOF

    # 4. הרצת הסקריפט
    - name: Execute Download Script
      run: |
        python download_apk.py "${{ github.event.inputs.play_store_url }}"

    # 5. שמירת קובץ ה-APK המוכן בטאב ה-Artifacts של GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: official-googleplay-apk
        path: '*.apk'
