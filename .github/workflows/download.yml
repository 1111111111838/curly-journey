name: Download APK via GPlayCLI

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'הכנס את שם החבילה (או קישור מלא של גוגל פליי)'
        required: true
        default: 'https://play.google.com/store/apps/details?id=com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. הגדרת סביבת פייתון
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 2. התקנת הכלי ותאימות פרוטובאף
    - name: Install GPlayCLI
      run: |
        pip install gplaycli
        pip install "protobuf<=3.20.3"

    # 3. יצירת קובץ הגדרות בתיקיית העבודה הנוכחית + ביטול שרת הטוקנים החיצוני
    - name: Configure GPlayCLI
      run: |
        cat << 'EOF' > gplaycli.conf
        [Credentials]
        gmail = ${{ secrets.GOOGLE_EMAIL }}
        password = ${{ secrets.GOOGLE_PASSWORD }}
        token_dispenser_url = ""
        
        [Cache]
        token = token.cache
        
        [Device]
        device = target
        EOF

    # 4. חילוץ מזהה האפליקציה והורדה
    - name: Download APK from Play Store
      run: |
        INPUT_VAL="${{ github.event.inputs.package_name }}"
        if [[ "$INPUT_VAL" == *"id="* ]]; then
          PACKAGE_ID=$(echo "$INPUT_VAL" | grep -oP 'id=\K[^&]+')
        else
          PACKAGE_ID="$INPUT_VAL"
        fi
        echo "Downloading package: $PACKAGE_ID"
        gplaycli -d "$PACKAGE_ID"

    # 5. שמירת קובץ ה-APK שהורד בטאב ה-Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: playstore-apk
        path: '*.apk'
