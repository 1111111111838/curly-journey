name: Download APK directly from Google Play

on:
  workflow_dispatch:
    inputs:
      play_store_url:
        description: 'הכנס את הקישור המלא לאפליקציה בגוגל פליי'
        required: true
        default: 'https://play.google.com/store/apps/details?id=com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # שלב חילוץ ה-Package Name מתוך הקישור
    - name: Extract Package Name
      id: extract_pkg
      run: |
        INPUT_VAL="${{ github.event.inputs.play_store_url }}"
        if [[ "$INPUT_VAL" == *"id="* ]]; then
          PACKAGE_ID=$(echo "$INPUT_VAL" | grep -oP 'id=\K[^&]+')
        else
          PACKAGE_ID="$INPUT_VAL"
        fi
        echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT

    # שימוש ב-Action פעיל, רשמי ומתוחזק שמוריד ישירות מגוגל פליי
    - name: Download APK from Play Store
      uses: darvincitech/play-store-downloader@v1
      with:
        email: ${{ secrets.GOOGLE_EMAIL }}
        password: ${{ secrets.GOOGLE_PASSWORD }}
        package_id: ${{ steps.extract_pkg.outputs.package_id }}

    # שמירת קובץ ה-APK שהורד בהצלחה בתוך ה-Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: playstore-apk
        path: '*.apk'
