name: Download APK - The Final Solution

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'הכנס את הקישור או את ה-Package Name'
        required: true
        default: 'com.tadiran.mytadiran.prod'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. התקנת הכלי הרשמי של ארגון ה-EFF לעקיפת חסימות והורדת אפליקציות
    - name: Install apkeep (EFF Official Tool)
      run: |
        echo "Downloading apkeep engine..."
        curl -sL "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-musl" -o apkeep
        chmod +x apkeep
        sudo mv apkeep /usr/local/bin/

    # 2. הרצת הכלי והורדת האפליקציה ישירות לשרת
    - name: Download APK
      run: |
        PKG_ID="${{ github.event.inputs.package_name }}"
        
        # ניקוי הקישור במידה והכנסת קישור מלא
        if [[ "$PKG_ID" == *"id="* ]]; then
          PKG_ID=$(echo "$PKG_ID" | grep -oP 'id=\K[^&]+')
        fi
        
        echo "Bypassing blocks and downloading official APK for: $PKG_ID"
        
        # פקודת הקסם שמורידה את הקובץ
        apkeep -a "$PKG_ID" .
        
        # נוודא שהורדנו ונשנה לשם נורמלי
        if ls *.apk 1> /dev/null 2>&1; then
          mv *.apk my-tadiran.apk
          echo "Success! The file is ready."
        else
          echo "Download failed!"
          exit 1
        fi

    # 3. שמירת הקובץ המוכן למשיכה ב-GitHub
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tadiran-apk-ready
        path: '*.apk'
