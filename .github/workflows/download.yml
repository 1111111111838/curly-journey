name: Download Single Tadiran APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # הורדה של קובץ APK בודד, שלם ונקי
    - name: Download Clean APK
      run: |
        echo "Downloading single unified APK..."
        
        # שימוש בשרת חילוץ ישיר שמביא קובץ APK אחד בלבד (בנפח של כ-60MB)
        curl -L -o "Tadiran_Official.apk" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          "https://d.apkpure.com/b/APK/com.tadiran.mytadiran.prod?version=latest"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tadiran-perfect-apk
        path: Tadiran_Official.apk
